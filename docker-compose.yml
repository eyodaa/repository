services:

  postgres:
    image: postgres:17
    container_name: ear-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: enterprise_repository
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: eyoda1524

    ports:
      - "5433:5432"

    volumes:
      - repository1_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d enterprise_repository" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: ear-backend
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/enterprise_repository
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: eyoda1524

    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: ear-frontend
    restart: unless-stopped

    ports:
      - "3000:80"

    depends_on:
      - backend

volumes:
  repository1_postgres_data:
    external: true
